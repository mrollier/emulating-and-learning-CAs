name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TensorFlow 2.14 (the paper's version, the last with Keras 2 and
      # LocallyConnected1D) has wheels up to Python 3.11 only.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Reproduce (quick subset)
        run: python reproduce.py quick
      - name: Committed data are unchanged by the reproduction
        run: git diff --exit-code -- data
