[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-emulators"
version = "1.0.0.dev0"
description = "Exact emulation of elementary and non-uniform cellular automata by convolutional neural networks"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = { text = "MIT" }
authors = [{ name = "Michiel Rollier", email = "michiel.rollier@ugent.be" }]
keywords = [
    "cellular automata",
    "non-uniform cellular automata",
    "convolutional neural networks",
    "TensorFlow",
    "CellPyLib",
    "reproducibility",
]
# The paper's versions. Keras 3 (TensorFlow >= 2.16) removed LocallyConnected1D.
dependencies = [
    "tensorflow==2.14.0",
    "keras==2.14.0",
    "numpy==1.26.4",
    "cellpylib==2.4.0",
    "matplotlib==3.8.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]
notebook = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.25"]
# Only needed to re-run scripts/extract_published_inputs.py.
dev = ["pymupdf>=1.24"]

[project.urls]
Repository = "https://github.com/mrollier/emulating-and-learning-CAs"
Paper = "https://doi.org/10.1007/978-3-031-71552-5_11"
Preprint = "https://arxiv.org/abs/2409.02722"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["verification"]
addopts = "-q -p no:cacheprovider"
markers = ["slow: long-running checks (run with `pytest -m slow`, skipped by `reproduce.py quick`)"]
filterwarnings = ["ignore::DeprecationWarning:tensorflow.*", "ignore::DeprecationWarning:keras.*",
                  "ignore::DeprecationWarning:flatbuffers.*", "ignore::DeprecationWarning:matplotlib.*",
                  "ignore:.*deprecated - use.*",
                  "ignore:non-integer arguments to randrange:DeprecationWarning"]
